<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <title>Bora.do</title>
    </head>
    <body>
        <header class="header">
            <div class="header__top">
                <a href="index.html" class="header__logo">
                    <img src="image/icon.png" alt="" width="32" height="32"> Bora.do
                </a>
                <p class="header__progress">
                    <span id="completedTasks">x</span> de 
                    <span id="numberTasks">y</span> feitas
                </p>
            </div>
            <h1>
                Bora, <span id="pendingMessage">faltam z tarefas</span>.
            </h1>
        </header>
        <main class="main">
            <section class="main__section">
                <form class="form__tasks">
                    <label for="inpTask">Nova tarefa</label>
                    <div>
                        <input type="text" id="inpTask" name="inpTask" placeholder="O que vamos fazer?" autocomplete="off" required>
                        <button type="submit" aria-label="Adicionar tarefa">
                            <img src="image/add.png" alt="" width="24" height="24"><span class="task-form__button-text">Adicionar</span>
                        </button>
                    </div>
                </form>
                <div class="div__filters">
                    <button type="button" class="filters__button filters__button--active" aria-pressed="true">Todas</button>
                    <button type="button" class="filters__button" aria-pressed="false">Pendentes</button>
                    <button type="button" class="filters__button" aria-pressed="false">Concluídas</button>
                </div>
                <ul class="task__list">
                    <li class="task">
                        <label class="task__label">
                            <input type="checkbox" class="task__checkbox">
                            <span class="task__title">Finalizar o README</span>
                        </label>
                        <div class="task__buttons">
                            <button class="task__action" type="button" aria-label="Editar: ">
                                <img src="image/edit.png" alt="" width="16" height="16">
                            </button>
                            <button class="task__action" type="button" aria-label="Excluir: ">
                                <img src="image/delete.png" alt="" width="16" height="16">
                            </button>
                        </div>
                    </li>
                </ul>
            </section>
        </main>
        <footer class="footer">
            <p>&copy; <span id="year"></span> Bora.do. Todos os direitos reservados.</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
